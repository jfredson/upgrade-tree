id = "link-wireless-brain-implant-controls-a-computer"
name = "A fully implanted wireless brain chip lets a paralysed person control a computer"
branch = "link"
description = """
A chip placed in the brain reads the signals that would have moved a hand and turns them into a
moving cursor or typed text, with nothing passing through the skin: no wires, no plug. Wired
versions have existed in trials since 2004. The fully wireless, fully implanted kind is the one
that could leave the laboratory, and the first person received one in January 2024."""
resolution = """
A person with paralysis, fitted with a brain implant that has no wired connection through the
skin, controls a computer cursor or types text by thought alone, as reported by the trial's
sponsor and confirmed by an independent report."""
