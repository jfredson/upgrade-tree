source = """
The paper as the journal published it, doi 10.1016/j.neuron.2024.11.008, free to read on the
journal's site (Cell Press's open archive). The authors' own copy is arXiv 2408.10234 (version 2),
which carries the same sentence."""
source_url = "https://doi.org/10.1016/j.neuron.2024.11.008"
source_locator = "the section headed \"The Musk illusion\", under \"Some implications of 10 bits/s\""
checked_how = "The published text: the journal's page read in a browser on 2026-10-23 (it refuses scripted requests), and the authors' copy on arXiv read in full the same day; the quoted sentence is word for word the same in both."
words = "we predict that Musk's brain will communicate with the computer at about 10 bits/s"
words_locator = "the section headed \"The Musk illusion\""
claimed = """
The paper estimates that human behaviour carries information at about 10 bits a second across the
tasks it examines (typing, speaking, memory contests and others), while the senses gather about a
billion, and it says the gap is unexplained. In the section on Musk it calls the feeling that our
inner life is much richer than we can express "the Musk illusion", quotes Musk saying Neuralink's
purpose is a high-bandwidth interface "such that we can be symbiotic with AI" because "we have a
bandwidth problem", and predicts that Musk's brain, linked to a computer, would communicate at about
10 bits a second; a telephone, it says, would do as well. The next section, on brain-computer
interfaces for patients, says such devices "could greatly benefit" people who struggle to speak,
and that "one really needs to convey only a few bits per second to and from the brain". Hedges:
the authors call the cause of the limit an open question and propose research to explain it; the
prediction about Musk rests on the research they review, not on a measurement of an implant."""
bears_on = ["link", "link-brain-link-carries-more-information-than-speech"]
bears_on_note = "The link to machines and its second number, the speed of the link between brain and machine; and the long shot that a brain link carries more information than speech, which the paper predicts will not happen in the sense the merger argument needs."
coverage = """
Carl Zimmer in The New York Times, 2024-12-26, "The Speed of Human Thought Lags Far Behind Your
Internet Connection, Study Finds" (reprinted on his own site); Rachel Nuwer in Scientific American,
2024-12-17."""
why_here = "The log enters critics of the merger idea on the same terms as its advocates. This is the first entry from people who measured the quantity the bandwidth argument rests on."
notes = """
Replies searched for on 2026-10-23 (letters in Neuron, preprints, commentary by brain-computer
interface researchers): no formal published reply was found. Two pushbacks were. Britton Sauerbrei,
a neuroscientist at Case Western Reserve University, told The New York Times (2024-12-26) that the
estimate leaves out the unconscious signals the body uses to stand, walk or recover from a trip,
which would give "a vastly higher bit rate", while finding the argument "pretty airtight" for
conscious tasks. Matt Angle, on the blog of the implant company Paradromics (2025-09-19,
https://paradromics.com/blog/the-speed-of-human-thought-and-its-implications-for-brain-computer-interfaces/,
read on 2026-10-23), accepts the low rate but argues that reading it out of the brain still takes
detailed recordings, and that restoring sight, or a more natural feel of controlling a robotic limb,
needs more than a few bits a second; the company makes high-bandwidth implants."""
