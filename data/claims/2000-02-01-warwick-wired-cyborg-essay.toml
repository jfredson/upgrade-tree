claimed = """
The 1998 implant, he says, was a test of whether information could pass to and from an implant;
it did, and for nine days doors opened and lights came on as he walked through his department.
From that he argues that highly intelligent machines will overtake people later this century, that
linking people to those machines by implant is a natural next step that would make superhumans in
effect, and that the alternative is machines ruling and people as second-class citizens. He also
predicts thought-to-thought communication replacing speech. Hedged as belief and envisioning
throughout; the plan for a second implant linked to his wife and an internet link from New York
are stated as intentions, not results. The essay opens with the line, often quoted, that he was
born human by accident of fate; that line is really there, as its first words."""
