claimed = """
Three routes are weighed. Whole brain emulation (pages 30 to 34): scanning, translation and
simulation; he says there is good reason to think the enabling technologies are attainable though
not soon, and that a first emulation would likely be imperfect; no date is attached. Biological
enhancement (pages 38 to 43 and 50): iterated embryo selection is set out step by step, could
select strongly for several traits at once, and seems to him an especially promising technology,
though slow and gradual next to machine intelligence; cohorts enhanced this way could be adults by
mid-century (page 43). Brain-computer interfaces (pages 44 to 51): implants could let people
borrow the strengths of digital computing, but he thinks it unlikely they will be widely used as
enhancements any time soon, and argues (page 46) that the limiting step in human intelligence is
not how fast data can be fed into the brain but how quickly the brain can make sense of it, so
more input bandwidth would do little unless the brain's own machinery were upgraded. He allows
the cyborg route is not without promise, citing a rat hippocampus prosthesis (page 47)."""
