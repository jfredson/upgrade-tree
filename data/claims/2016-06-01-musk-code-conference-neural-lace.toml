claimed = """
Unprompted, near the end of the interview, he names something he thinks will be quite important
and that he knows of no company working on seriously: a neural lace. His reasoning: at any rate of
progress in AI, people will be left far behind, and even in what he calls a benign situation they
would be so far below it in intelligence that they would be like a pet, a house cat. The answer
that to him seems maybe the best is to add a digital layer, a third layer above the cortex,
working with the rest of the brain as the cortex works with the older part beneath it. He says
people are already cyborgs because of their phones and computers, and that the limit is how slowly
information gets out of a person, two thumbs tapping on a phone. Merging with digital
intelligence, he says, mostly comes down to removing that limit with some sort of direct link to
the cortex. Pressed on whether that means surgery, he says not necessarily: it could go in through
the veins and arteries rather than through the skull. With a high-bandwidth link, he says, a
person is no longer a house cat. Hedged throughout: one of the solutions, maybe the best, some
sort of."""
