claimed = """
Framing hedge first: the piece is published under the newspaper's label of fiction, set in an
imagined Manhattan clinic selling an enhancement bundle it calls Merge, so its claims are offered
as an imagined future rather than a forecast; the argument itself is hers. Two possible ceilings on
merging with AI. A consciousness ceiling: if microchips turn out to be the wrong material for
consciousness (which she assumes for the sake of argument), replacing brain parts with chips would
diminish or end your life as a conscious being, and because working memory and attention seem
tied to consciousness, we may be stuck with our existing bandwidth limits. A self ceiling: the
mind-is-software view does not hold, since programs are abstract objects while minds act in space
and time, so there is no ground for confidence that the self survives a merge or even less radical
enhancements. She hedges explicitly that we do not know whether there is a self ceiling or where
it sits, and closes by asking for humility. She does not say partial enhancement is safe; she says
it is uncertain."""
