claimed = """
Chapter 1 says the Singularity will let us control our fate and live as long as we want, which he
distinguishes from living forever, and that by the end of this century the non-biological part of
our intelligence will be vastly stronger than unaided human intelligence. In chapter 3 ("Setting
a Date for the Singularity") he sets the Singularity, which he calls a profound and disruptive
transformation in human capability, at 2045, and says the non-biological intelligence created that
year will be a billion times more powerful than all human intelligence today; the page is 136 per
the standard citation, bracketed by the contents page (section begins page 127, chapter 4 begins
page 143) but not seen directly, because the lending scans could not be searched. He adds that we
will transcend biology but not our humanity. Chapter 1 also lists, as a projection, billions of
nanobots in the capillaries of the brain vastly extending human intelligence, and the chapter 5
dialogue has him say we are going to merge with our technology. The nanobot era is placed in the
2020s elsewhere (chapter 4)."""
