claimed = """
Having said that AI will be vastly smarter than people, he is asked what to do in that situation.
He says he is not sure and hopes the machines are nice, then offers what he calls the old saying
about joining what cannot be beaten, and says that is what Neuralink is about: whether people can
go along for the ride with AI. He says there should be other companies like it, building a
high-bandwidth interface to the brain. People are already cyborgs, he says, because they are so
bound up with their phones and computers, but the link to the phone is very slow, and even if AI
