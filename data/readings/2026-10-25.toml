sources = ["https://www.lifebiosciences.com/life-biosciences-announces-first-in-human-data-from-ongoing-phase-1-trial-evaluating-er-100-in-optic-neuropathies/"]
opened = ["https://www.lifebiosciences.com/life-biosciences-announces-first-in-human-data-from-ongoing-phase-1-trial-evaluating-er-100-in-optic-neuropathies/"]
for_john = "Change I would have made: either nothing (stay at shown in animals) or move the stage up one rung to first human, dated by the first dosing (about 2026-06-09, the exact date unconfirmed). I stopped because the entry's test and the ladder disagree. The ladder says first human is reached when at least one person has had the treatment with a public record; the entry's test says the first-human rung needs a measured biological-age marker or restored tissue function moved towards youth, compared with controls, in a peer-reviewed report. Under the entry's test it is not met: the 2026-10-08 company release has three people, no control group, no age marker, and no journal paper. Under the ladder wording it arguably is met. The record is a record older than the window that the entry missed. Please rule which wording governs, and whether to add a watch term such as ER-100 or Life Biosciences."

