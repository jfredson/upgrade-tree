[[upgrade]]
id = "inheritance-child-born-from-a-gene-edited-embryo"
name = "A child is born from an embryo whose genes were edited on purpose"
branch = "inheritance"
description = """
The genes of a human embryo are changed before it is implanted, and a child is born carrying the
change, able to pass it on. This happened in 2018, in China, against the rules of the field and
the law, and the scientist responsible went to prison. The record keeps it at the stage it
reached, because the ladder records what has happened, not whether it was allowed."""
resolution = """
A live birth is publicly confirmed, by the people who did it or by an official inquiry, of a
child whose genome was deliberately altered at the embryo stage with the intent that the change
be carried in every cell."""
source = "The scientific or official record confirming the birth and the edit (a published report, a court or inquiry finding, or a government statement)"
