# Upgrades under the Inheritance branch. Record layout: docs/upgrade-schema.md.
# The first real list, written 2026-10-16 from the charter's leaf list (ruled by me the same
# day), replacing the example entry seeded earlier that day. Every stage above idea-only has a
# date and a primary record; anything still written from memory is in the entry's verify list.

[[upgrade]]
id = "inheritance-child-born-from-a-gene-edited-embryo"
name = "A child is born from a gene-edited embryo"
branch = "inheritance"
description = """
The genes of a human embryo are changed before it is implanted, and a child is born carrying the
change in every cell, able to pass it on. This happened in China in 2018, against the rules of the
field and the law: twin girls, then a third child, with a gene disabled in the hope of making them
resistant to HIV. The scientist responsible announced it himself and went to prison for it. The
record keeps the entry at the stage it reached, because the ladder records what has happened, not
whether it was allowed."""
resolution = """
A live birth is publicly confirmed, by the people who did it or by an official inquiry, of a child
whose genome was deliberately altered at the embryo stage with the intent that the change be carried
in every cell."""
source = "The scientific or official record confirming the birth and the edit (a published report, a court or inquiry finding, or a government statement)"
horizon = "root"
status = "tracked"
depends_on = []
stage = "first-human"
stage_reached_on = 2018-11-25
stage_record = "http://www.xinhuanet.com/english/2019-12/30/c_138666892.htm"
notes = """
The date is the day He Jiankui posted his own announcement of the twins' birth; the record linked
is the state news agency's report of the Shenzhen court's verdict of 30 December 2019, the official
finding that three gene-edited babies were born, since no scientific paper was ever published. The
provincial investigation of January 2019 had confirmed the twins and a second pregnancy. Editing
embryos for birth is prohibited in every country that has ruled on it, so the next rung needs a
regulator to change its mind; the horizon is set long for that reason."""

[[upgrade]]
id = "inheritance-baby-born-with-donor-mitochondria"
name = "A baby is born with donor mitochondria to avoid an inherited disease"
branch = "inheritance"
description = """
Mitochondria, the parts of a cell that make its energy, carry a little DNA of their own, passed only
from mother to child; faults in it cause diseases that are often fatal in childhood. Moving the
nucleus of the mother's egg into a donor's egg with healthy mitochondria gives a child that is
genetically the parents' with a small part from a third person. The first such child was born in
2016, in Mexico, to avoid a rule elsewhere; Britain had already made it lawful under licence, and
eight children born there were reported in 2025. It is the only change to inheritance a regulator
has approved."""
resolution = """
A child is born after a procedure that replaced the mother's faulty mitochondria with a donor's,
done to prevent a named inherited disease, with the birth confirmed by the clinic or regulator; the
rung in clinical use needs a regulator's licence under which such births take place outside a
trial."""
source = "The regulator's licence record (the United Kingdom's Human Fertilisation and Embryology Authority) and the peer-reviewed birth reports"
horizon = "mid"
status = "tracked"
depends_on = []
stage = "in-clinical-use"
stage_reached_on = 2017-03-15
stage_record = "https://www.hfea.gov.uk/about-us/news-and-press-releases/2017/hfea-statement-on-mitochondrial-donation/"
earlier_stages = [
  { stage = "first-human", reached_on = 2016-04-06, record = "https://doi.org/10.1016/j.rbmo.2017.01.013" },
]
notes = """
The in-clinical-use record is the British regulator's approval of the first clinic licence, to
Newcastle Fertility at Life, in March 2017; the first births under it were confirmed by the regulator
in 2023 (fewer than five, in answer to a freedom-of-information request) and eight were reported in
the New England Journal of Medicine in July 2025. The first-human record is the 2017 paper on the
boy born in Mexico in 2016 to a mother carrying Leigh syndrome. The paper gives no birth date (only
that the boy was seven months old when it was written). The day, 6 April 2016, is from New Scientist's
report that broke the story, dated 2016-09-27 (Jessica Hamzelou, in the box "Two women, one man and a
baby": "the boy was born on 6 April 2016"; https://www.newscientist.com/article/2107219-exclusive-worlds-first-baby-born-with-new-3-parent-technique/),
which CBS News repeated. No document from the clinic or the authors that could be opened gives the day,
so the news report is the source; it fits the paper and the same report's "five-month-old" on
2016-09-27. Children born in the 1990s after a
cruder transfer of egg cytoplasm also carried a donor's mitochondria, but for infertility rather than
to avoid a disease, so they fall outside this entry's test. The rung in wide use needs a counted
population in the hundreds or more, and the total so far is in the tens."""

[[upgrade]]
id = "inheritance-embryos-chosen-by-a-genetic-score-for-traits"
name = "Embryos are chosen by a genetic score for traits, not disease"
branch = "inheritance"
description = """
Fertility clinics have long tested embryos for single-gene diseases. Since 2019 companies have sold
scores that add up thousands of small genetic differences to rank embryos by their risk of common
diseases, and since 2025 two have sold rankings for traits that are not diseases at all: predicted
height, predicted intelligence, eye colour. No regulator reviews these scores, the predictions are
weak at the level of one embryo, and the practice is condemned by most of the field. It is on the
tree because it is being done, to paying customers, through named clinics."""
resolution = """
A company offers, and a named fertility clinic performs, selection among a couple's embryos using
a score for a trait that is not a disease (height, intelligence, appearance), with the offer public
on the company's own site; the rung in clinical use rests on that routine commercial availability,
since no regulator has approved or forbidden it."""
source = "The companies' own announcements and product pages, the named clinics' statements, and any regulator's notice if one acts"
horizon = "leaf"
status = "tracked"
depends_on = []
stage = "in-clinical-use"
stage_reached_on = 2025-06-04
stage_record = "https://mynucleus.com/deep-dives/embryo"
notes = """
The record is Nucleus Genomics' own page for its embryo product, launched in June 2025 with scores
for appearance and cognitive ability and later listing predicted IQ and height; a second company,
Herasight, came out of hiding in July 2025 and announced an intelligence predictor for embryos in
October 2025. The first baby chosen by a polygenic score (2020) was screened for disease risk only,
so it does not count here. This is the one entry on the tree whose rung rests on a commercial
offering rather than a regulator or a paper: the ladder's in-clinical-use rung allows "routine use
in a named clinical setting", and the named clinic is in the companies' own announcements. If I
would rather hold this rung for a regulator's say, the stage falls to first human on the same
record, since customers have used the scores."""

[[upgrade]]
id = "inheritance-mammal-carried-to-birth-in-an-artificial-womb"
name = "A mammal is carried to birth in an artificial womb"
branch = "inheritance"
description = """
The end point of taking birth out of the body: an animal that goes from a fertilised egg to a live
birth with no mother at any stage. Nothing has done this. The two famous results are halves: in
2017 lambs taken from their mothers two thirds of the way through pregnancy lived for four weeks in
a fluid-filled bag and were born from it; in 2021 mouse embryos grew in bottles from a few days old
to about the midpoint of pregnancy. The gap between the two halves has not been bridged in any
mammal, which is why this entry sits at the bottom of the ladder with a precise test."""
resolution = """
A mammal develops from fertilisation, or at the latest from before the midpoint of its normal
gestation, to a live birth entirely outside any body, and survives, in a peer-reviewed report. Support
of a fetus taken from its mother late in pregnancy, however long, does not count."""
source = "Peer-reviewed reports; a company's claim counts only when the paper exists"
horizon = "mid"
status = "tracked"
depends_on = []
stage = "idea-only"
notes = """
The charter expected this leaf at shown in animals. The test above is stricter by choice, because
the words "carried to birth" promise the whole pregnancy and no animal result delivers it: the 2017
Philadelphia lambs entered the bag at 104 to 135 days of a 145-day gestation, and the 2021 Israeli
mouse embryos stopped at day 11 of about 20. A company working on extinct-species revival has said
it aims to have a mammal born fully outside a body, with no peer-reviewed result yet. Either half
would be an entry of its own if I want the partial results on the tree; the artificial womb for
very premature babies, the human use of the 2017 work, is heading for trials and would belong on
the Lifespan and repair branch."""
